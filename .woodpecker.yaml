# The gate, in the format a Woodpecker server would run.
#
# One step, and it calls the repository's own `check:full` rather than restating
# what that check does. A pipeline that lists lint, typecheck and tests
# separately is a second definition of healthy, and the two drift the first time
# either changes.
#
# This gate covers the web half only. A build that produces an APK needs the
# Android SDK and a device, which no container runner here has; that build is run
# by `pnpm android:install` on the machine that owns the phone.
#
# Run it locally with no server:
#
#   woodpecker-cli exec .woodpecker.yaml
when:
  - event: [push, pull_request]

steps:
  - name: gate
    image: node:26-bookworm
    environment:
      CI: "1"
    commands:
      # Corepack is no longer bundled with Node, so the pin is read from the
      # repository and installed directly. That is stricter than corepack
      # anyway: the pipeline uses exactly the pnpm version declared here.
      - PNPM_VERSION=$(node -p "require('./package.json').packageManager.split('@')[1]")
      - npm install -g "pnpm@$PNPM_VERSION"
      - pnpm install --frozen-lockfile
      - pnpm check:full
