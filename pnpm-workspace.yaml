packages:
  - "apps/*"
  - "packages/*"

# The contract is consumed as a workspace package, so a local edit is visible to
# the app without a publish. It carries a plain version rather than `workspace:*`
# in anticipation of a future consumer installing it from a git URL, which cannot
# resolve a workspace range.
linkWorkspacePackages: true

allowBuilds:
  # Capacitor's CLI runs no install scripts; the Android project is generated by
  # an explicit `cap add`, so nothing here is allowed to run code at install time.
  esbuild: true
